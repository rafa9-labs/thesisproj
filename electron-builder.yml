# KodaQuant — Electron Builder Configuration
# Docs: https://www.electron.build/configuration.yml

appId: com.kodaquant.app
productName: "KodaQuant"
copyright: "Copyright © 2026 rafa9-labs"

# Directories
directories:
  output: ../release
  buildResources: ../build

# Files to include in the asar archive
files:
  - dist/**/*
  - electron-dist/**/*

# Unpack from asar (these need to be accessed by the Python process)
asar: true
asarUnpack:
  - "**/*.node"

# Extra resources (bundled alongside the app, not in asar)
extraResources:
  - from: ../dist/fx_backend
    to: backend
    filter:
      - "**/*"
  - from: ../csv_data
    to: csv_data
    filter:
      - "**/*.csv"

# Windows-specific config
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Code signing: set env var CSC_LINK (p12 cert path) and CSC_KEY_PASSWORD for production.
  # For dev builds without signing, signAndEditExecutable: false skips signing entirely.
  signAndEditExecutable: false

# NSIS installer config
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "KodaQuant"
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  installerLanguages:
    - en_US
  language: 1033
  installerHeader: installer-header.bmp
  installerSidebar: installer-sidebar.bmp

# File type associations
fileAssociations:
  - ext: fxbacktest
    name: KodaQuant Config
    description: "KodaQuant Configuration"
    icon: icon.ico

# Linux (for future)
linux:
  icon: icon.png
  target:
    - AppImage
  category: Finance

# macOS (for future, if needed)
mac:
  icon: icon.png
  target:
    - dmg

# Publishing (GitHub Releases)
publish:
  provider: github
  owner: rafa9-labs
  repo: thesisproj
  releaseType: release