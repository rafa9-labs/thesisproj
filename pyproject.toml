[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "node_modules",
    ".venv*",
    "dist",
    "build",
    "results",
    "csv_data",
    "utilsNoWFO.py",
    "tuningNoWFO.py",
    "frontend",
    "electron",
]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests needing local data/backend (deselect with '-m \"not api\"')",
    "benchmark: marks benchmark/timing tests",
    "deep: marks deep learning model tests (TF/Keras, high memory)",
]
addopts = "--tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]