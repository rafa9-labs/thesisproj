[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "node_modules",
    ".venv*",
    "dist",
    "build",
    "results",
    "csv_data",
    "utilsNoWFO.py",
    "tuningNoWFO.py",
    "frontend",
    "electron",
]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-x --tb=short"