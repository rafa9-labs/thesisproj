services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./csv_data:/app/csv_data:ro
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models:ro
      - ./pipeline:/app/pipeline:ro
      - ./api:/app/api:ro
      - ./config.py:/app/config.py:ro
      - ./schemas:/app/schemas:ro
      - ./hpo:/app/hpo:ro
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - API_REDIS_URL=redis://redis:6379/0
      - API_CELERY_BROKER_URL=redis://redis:6379/0
      - API_CELERY_RESULT_BACKEND=redis://redis:6379/1
      - VAST_API_KEY=${VAST_API_KEY:-}
      - OANDA_ACCESS_TOKEN=${OANDA_ACCESS_TOKEN:-}
      - OANDA_ACCOUNT_ID=${OANDA_ACCOUNT_ID:-}
      - FX_DATA_DIR=/app/data

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["celery", "-A", "api.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-E"]
    volumes:
      - ./csv_data:/app/csv_data:ro
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models:ro
      - ./pipeline:/app/pipeline:ro
      - ./api:/app/api:ro
      - ./config.py:/app/config.py:ro
      - ./schemas:/app/schemas:ro
      - ./hpo:/app/hpo:ro
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - API_REDIS_URL=redis://redis:6379/0
      - API_CELERY_BROKER_URL=redis://redis:6379/0
      - API_CELERY_RESULT_BACKEND=redis://redis:6379/1
      - VAST_API_KEY=${VAST_API_KEY:-}
      - OANDA_ACCESS_TOKEN=${OANDA_ACCESS_TOKEN:-}
      - OANDA_ACCOUNT_ID=${OANDA_ACCOUNT_ID:-}
      - FX_DATA_DIR=/app/data
    restart: unless-stopped
    stop_grace_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:3000"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
